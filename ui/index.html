<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MCP Radar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,650;6..72,750&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div class="kicker">MCP Radar</div>
        <h1>Inspect MCP servers before giving them access to your tools.</h1>
        <form id="searchForm" class="search-panel">
          <input id="queryInput" type="search" placeholder="Ask in English: Find a safe MCP for Postgres, Gmail, GitHub issues..." autocomplete="off" />
          <button id="searchButton" type="submit">Search</button>
        </form>
        <div class="hint-row">
          <button class="hint" data-query="inspect postgres database safely">postgres risk</button>
          <button class="hint" data-query="gmail email follow up">gmail access</button>
          <button class="hint" data-query="github issues pull requests">github issues</button>
          <button class="hint" data-query="browser automation local tools">browser automation</button>
        </div>
        <nav id="categoryRail" class="category-rail" aria-label="MCP categories"></nav>
      </section>

      <section class="stats-bar" aria-label="Library stats">
        <div><span id="totalCount">0</span><small>MCPs</small></div>
        <div><span id="mentionCount">0</span><small>mentions</small></div>
        <div><span id="candidateCount">0</span><small>candidates</small></div>
        <div><span id="syncedAt">Never</span><small>last sync</small></div>
      </section>

      <section class="library-head">
        <div>
          <p class="section-label">Library</p>
          <h2 id="libraryTitle">Best matches</h2>
        </div>
        <span id="resultCount">0 found</span>
      </section>

      <section id="results" class="library-grid"></section>

      <details class="maintenance">
        <summary>Update sources</summary>
        <div class="maintenance-actions">
          <button id="ingestButton">Ingest all sources</button>
          <button id="syncButton">Sync registry only</button>
          <button id="trendingButton">Show trending</button>
          <button id="candidatesButton">Show candidates</button>
          <button id="mentionsButton">Show mentions</button>
        </div>
      </details>
    </main>

    <template id="cardTemplate">
      <article class="card">
        <div class="card-top">
          <div>
            <h3></h3>
            <p class="name"></p>
          </div>
          <span class="risk-pill"></span>
        </div>
        <p class="description"></p>
        <div class="signal-row"></div>
        <p class="risk-summary"></p>
        <details class="risk-details"><summary>Risk report</summary><div class="risk-report"></div></details>
        <details class="install-details"><summary>Install recipe</summary><div class="recipes"></div></details>
        <div class="link-row"></div>
      </article>
    </template>

    <template id="mentionTemplate">
      <article class="card mention-card">
        <div class="card-top">
          <div>
            <h3></h3>
            <p class="name"></p>
          </div>
          <span class="risk-pill neutral">signal</span>
        </div>
        <p class="description"></p>
        <div class="link-row"></div>
      </article>
    </template>

    <script type="module" src="/app.js"></script>
  </body>
</html>
